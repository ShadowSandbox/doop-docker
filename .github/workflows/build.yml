# Builds the upstream doop release (https://github.com/kgoedecke/doop) with its
# own Dockerfile and pushes a multi-arch image to GHCR. This repo holds no app
# source: the build context is the upstream Git repo at the release tag.
#
# Runs every 6 hours and skips the build when the latest release is already in
# GHCR. Run it by hand to build a given tag or to force a rebuild.
name: Build and push image

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag, for example v0.12.0. Empty means the latest release.
        required: false
        default: ''
      force:
        description: Rebuild even when the image tag already exists
        type: boolean
        default: false

concurrency:
  group: build-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  UPSTREAM: kgoedecke/doop

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      latest: ${{ steps.check.outputs.latest }}
      image: ${{ steps.check.outputs.image }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          # App releases are tagged vX.Y.Z; desktop-vX.Y.Z tags are the desktop shell.
          latest=$(gh release list -R "$UPSTREAM" -L 50 --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0]')
          tag="${INPUT_TAG:-$latest}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a release tag: '$tag'"
            exit 1
          fi

          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/doop"
          version="${tag#v}"
          build=true
          if [ "$FORCE" != true ] && docker buildx imagetools inspect "$image:$version" >/dev/null 2>&1; then
            echo "$image:$version already exists, skipping build"
            build=false
          fi

          {
            echo "build=$build"
            echo "tag=$tag"
            echo "version=$version"
            echo "latest=$([ "$tag" = "$latest" ] && echo true || echo false)"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: https://github.com/${{ env.UPSTREAM }}.git#${{ needs.check.outputs.tag }}
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=doop
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ env.UPSTREAM }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0
          outputs: type=image,name=${{ needs.check.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.check.outputs.image }}
          VERSION: ${{ needs.check.outputs.version }}
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          # 0.12.3 -> tags 0.12.3, 0.12 and (for the newest release) latest
          tags=(-t "$IMAGE:$VERSION" -t "$IMAGE:${VERSION%.*}")
          if [ "$LATEST" = true ]; then tags+=(-t "$IMAGE:latest"); fi
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
